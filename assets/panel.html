<script>window.DATA={"clues": [{"id": "CL-062", "content": "🔴 华莱士教授失联。 航班后天到但联系不上", "source": "玛莎", "verified": "high", "confidence": "high", "tags": "[\"martha\", \"mithras\", \"professor\", \"wallace\", \"华莱士\", \"玛莎\"]", "linked_ids": "[\"CL-038\"]"}, {"id": "CL-068", "content": "🔴🔴🔴 \"6双目睹智慧的眼睛\"→\"目睹墙后面的主人\"→\"高喊他的名\"", "source": "李锐光（催眠中）", "verified": "high", "confidence": "high", "tags": "[\"cuimian\", \"hypnosis\", \"liruiguang\", \"victim\", \"催眠\", \"李锐光\"]", "linked_ids": "[\"CL-046\"]"}, {"id": "CL-069", "content": "\"不能成立，如成立的话\"——抗拒仪式", "source": "李锐光", "verified": "high", "confidence": "high", "tags": "[\"liruiguang\", \"ritual\", \"victim\", \"yishi\", \"仪式\", \"李锐光\"]", "linked_ids": "[\"CL-068\"]"}, {"id": "CL-075", "content": "🔴 \"亵渎的，无法发出声音的名字\"——KP旁白", "source": "KP旁白", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"blasphemy\", \"kp_narration\", \"name\", \"亵渎\", \"钱德睿\"]", "linked_ids": "[\"CL-068\"]"}, {"id": "CL-081", "content": "🔴🔴🔴 棕发少年（15-16岁）持老式相机，医院外主动搭话", "source": "KP场景", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"camera\", \"kp_scene\", \"xiangji\", \"相机\"]", "linked_ids": "[\"CL-058\"]"}, {"id": "CL-083", "content": "少年：\"和最近那些进医院的失明的人类似的气息\"——系统性跟踪", "source": "少年发言", "verified": "high", "confidence": "high", "tags": "[\"blindness\", \"shiming\", \"失明\"]", "linked_ids": "[\"SL-001\"]"}, {"id": "CL-085", "content": "🔴🔴🔴 棕发少年调出照片——\"神秘的水手\"： 穿着破烂湿漉漉的服装，像一具浮肿的尸体。老式相机拍摄的模糊照片。", "source": "少年相机照片 + KP", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"entity\", \"mysterious_sailor\", \"sailor\", \"swollen\", \"xiangji\", \"水手\", \"浮肿\", \"相机\"]", "linked_ids": "[\"CL-040\", \"CL-046\", \"CL-072\"]"}, {"id": "CL-086", "content": "🔴🔴🔴 \"每当有人失明被送进医院，这个神秘的水手就会出现。\" 实体与失明事件存在直接因果关系——不是偶然关联。", "source": "棕发少年", "verified": "high", "confidence": "high", "tags": "[\"blindness\", \"mysterious_sailor\", \"sailor\", \"shiming\", \"失明\", \"水手\"]", "linked_ids": "[\"CL-085\"]"}, {"id": "CL-087", "content": "🔴 照片引发目眩——SC 0/1。朗格（55/60成功）、藤堂（7/65极难成功）、林芷（42/55成功），全员通过，零SAN损失。", "source": "骰子记录", "verified": "high", "confidence": "high", "tags": "[\"SAN\", \"critical\", \"detective\", \"dice\", \"doctor\", \"extreme_success\", \"lange\", \"san\", \"sanity\", \"sanity_check\", \"sc\", \"todo\", \"朗格\", \"极难成功\", \"检定\", \"藤堂咲\", \"骰子\"]", "linked_ids": "[\"CL-085\"]"}, {"id": "CL-089", "content": "朗格已将水手照片+消息发至四人群聊——刘元贞也将看到照片（SC待定）", "source": "朗格RP", "verified": "high", "confidence": "high", "tags": "[\"SAN\", \"detective\", \"lange\", \"liu_yuanzhen\", \"mysterious_sailor\", \"sailor\", \"sanity_check\", \"sc\", \"taoist\", \"刘元贞\", \"朗格\", \"水手\"]", "linked_ids": "[\"CL-085\"]"}, {"id": "CL-093", "content": "林芷开出悬赏：500HKD/有用照片 + 3000HKD私人奖金。罗泽恩答应拍到关键内容会发过来。", "source": "林芷+罗泽恩RP", "verified": "high", "confidence": "high", "tags": "[\"hkd\", \"luozeen\", \"罗泽恩\"]", "linked_ids": "[\"—\"]"}, {"id": "CL-097", "content": "🔴 藤堂确认——罗泽恩对照片\"非常抗拒\"，相机里肯定有问题。不会轻易交出。", "source": "藤堂咲（心理学+RP）", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"doctor\", \"luozeen\", \"psychology\", \"todo\", \"xiangji\", \"xinlixue\", \"心理学\", \"相机\", \"罗泽恩\", \"藤堂咲\"]", "linked_ids": "[\"CL-094\", \"CL-095\"]"}, {"id": "CL-098", "content": "藤堂邀请罗泽恩回家与养女共进晚餐——\"聊一聊拍摄，我的女儿应该会很有兴趣\"。以拍摄为饵，延长观察时间。", "source": "藤堂咲RP", "verified": "medium", "confidence": "medium", "tags": "[\"doctor\", \"luozeen\", \"todo\", \"罗泽恩\", \"藤堂咲\"]", "linked_ids": "[\"SL-002\"]"}, {"id": "CL-100", "content": "藤堂养女名字：夕立（日语：傍晚的暴风雨/骤雨）——与\"水手/海洋/风暴\"主题产生共鸣。", "source": "藤堂咲", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"doctor\", \"mysterious_sailor\", \"sailor\", \"todo\", \"xili\", \"夕立\", \"夕莉\", \"水手\", \"藤堂咲\"]", "linked_ids": "[\"SL-002\"]"}, {"id": "CL-102", "content": "林芷心理学43/65成功——罗泽恩的语气和表情\"确实有一些奇怪\"，但林芷无法确定具体含义。", "source": "林芷检定", "verified": "high", "confidence": "high", "tags": "[\"luozeen\", \"psychology\", \"xinlixue\", \"心理学\", \"罗泽恩\"]", "linked_ids": "[\"CL-095\"]"}, {"id": "CL-104", "content": "🔴🔴 罗泽恩在持续施压下最终交出相机。 林芷翻看。", "source": "林芷+罗泽恩RP", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"luozeen\", \"xiangji\", \"相机\", \"罗泽恩\"]", "linked_ids": "[\"CL-094\"]"}, {"id": "CL-106", "content": "困难侦查成功揭露——相机的自主隐藏行为被林芷感知。", "source": "林芷侦查检定", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"hard_spot\", \"investigation\", \"xiangji\", \"侦查\", \"相机\"]", "linked_ids": "[\"CL-105\"]"}, {"id": "CL-107", "content": "林芷SC 11/55 极难成功——SAN 55→54（仅扣1点）。意志力极强。", "source": "骰子记录", "verified": "high", "confidence": "high", "tags": "[\"SAN\", \"critical\", \"dice\", \"extreme_success\", \"san\", \"sanity\", \"sanity_check\", \"sc\", \"极难成功\", \"检定\", \"骰子\"]", "linked_ids": "[\"CL-105\"]"}, {"id": "CL-109", "content": "🔴 罗泽恩语气突变——冷冰冰/麻木：\"该还给我了吧，相机里面确实没有什么东西重要的。\" 交出相机被翻看后，态度从温和沉稳变为冷漠。", "source": "罗泽恩 + KP", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"luozeen\", \"xiangji\", \"相机\", \"罗泽恩\"]", "linked_ids": "[\"CL-095\"]"}, {"id": "CL-110", "content": "林芷拍照留档相机内容后支付3000HKD——\"无论如何，我们都是讲信用的。\" 悬赏承诺履行。", "source": "林芷RP", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"hkd\", \"xiangji\", \"相机\"]", "linked_ids": "[\"CL-093\"]"}, {"id": "CL-113", "content": "🔴🔴 相机归还→罗泽恩瞬间恢复。 交出相机时冷冰冰/麻木，拿回相机\"瞬间像是恢复了之前的神情\"。相机在手与否直接关联他的行为模式。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"camera\", \"kp_scene\", \"luozeen\", \"xiangji\", \"相机\", \"罗泽恩\"]", "linked_ids": "[\"CL-109\"]"}, {"id": "CL-116", "content": "罗泽恩收下3000HKD+\"多谢惠顾\"——交易关系建立。", "source": "罗泽恩", "verified": "high", "confidence": "high", "tags": "[\"hkd\", \"luozeen\", \"罗泽恩\"]", "linked_ids": "[\"CL-110\"]"}, {"id": "CL-119", "content": "团队正式分头——藤堂+朗格+罗泽恩→宾馆/午饭；林芷→警局；刘元贞→留医院。", "source": "全员RP", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"doctor\", \"lange\", \"liu_yuanzhen\", \"luozeen\", \"taoist\", \"todo\", \"刘元贞\", \"朗格\", \"罗泽恩\", \"藤堂咲\"]", "linked_ids": "[\"CL-080\"]"}, {"id": "CL-120", "content": "🔴 A市失明案件汇总——五名失明者： 西门鑫（42岁渔夫后裔，两月前）→唐蓉蓉（李氏金融经理，两月前）→陈省（30岁船舶工程师，积极配合治疗/女儿学费）→夕莉（藤堂养女，一周前）→李锐光（三天前）。失明间隔在缩短。", "source": "林芷警局调查+教育极难成功7/80", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"blindness\", \"chen_sheng\", \"critical\", \"doctor\", \"engineer\", \"extreme_success\", \"fisherman\", \"liruiguang\", \"manager\", \"shiming\", \"tang_rongrong\", \"todo\", \"victim\", \"xili\", \"ximen_xin\", \"唐蓉蓉\", \"夕立\", \"夕莉\", \"失明\", \"李锐光\", \"极难成功\", \"藤堂咲\", \"西门鑫\", \"陈省\"]", "linked_ids": "[\"SL-001\"]"}, {"id": "CL-121", "content": "🔴🔴 五人共同点：祖籍金柏村，均与李氏航运有过关联。 李氏前身=李氏航运公司，海外船运。金柏村=发源地。", "source": "林芷警局调查", "verified": "high", "confidence": "high", "tags": "[\"ancestral\", \"jinbai\", \"village\", \"金柏村\"]", "linked_ids": "[\"CL-120\"]"}, {"id": "CL-123", "content": "🔴 陈省正在彗心医院积极配合治疗—— 和你在同一栋楼。唯一醒着/积极配合的失明者。", "source": "林芷警局调查", "verified": "high", "confidence": "high", "tags": "[\"blindness\", \"chen_sheng\", \"engineer\", \"huixin_hospital\", \"shiming\", \"医院\", \"失明\", \"陈省\"]", "linked_ids": "[\"CL-120\"]"}, {"id": "CL-124", "content": "李明光（李锐光父亲）正在美国学校演讲——短时间不回。李氏几代单传，\"香火极差\"。\"绝后\"传言流传中。", "source": "出入境+背景调查", "verified": "high", "confidence": "high", "tags": "[\"father\", \"heirless\", \"li_mingguang\", \"lineage\", \"liruiguang\", \"victim\", \"李明光\", \"李锐光\", \"绝后\"]", "linked_ids": "[\"CL-055\"]"}, {"id": "CL-125", "content": "🔴 罗泽恩真实背景： 父亲死于火灾，母亲在翰光疗养院。原住金柏村（已荒废）。本人无问题——普通勤工俭学学生。", "source": "林芷警局调查", "verified": "high", "confidence": "high", "tags": "[\"ancestral\", \"hanguang\", \"jinbai\", \"luozeen\", \"sanatorium\", \"village\", \"李翰光\", \"罗泽恩\", \"翰光疗养院\", \"金柏村\"]", "linked_ids": "[\"CL-091\"]"}, {"id": "CL-126", "content": "🔴 罗泽恩看到火焰后大喊着冲了出去——他知道这是什么或预料到了。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"fire\", \"flame\", \"kp_scene\", \"luozeen\", \"炎之精\", \"罗泽恩\"]", "linked_ids": "[\"CL-101\", \"CL-213\"]"}, {"id": "CL-127", "content": "火焰形态特征：深红色闪电状、咆哮、浓厚黑烟——非普通火灾，是自主行动的超自然火焰实体。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"fire\", \"flame\", \"kp_scene\", \"炎之精\"]", "linked_ids": "[\"CL-214\"]"}, {"id": "CL-128", "content": "🔴🔴 罗泽恩之前的话成真—— \"她一定非常开心快乐，天真无邪。甚至不知道坏人是什么样的。\" 他预知了夕立会被攻击。", "source": "回顾CL-101", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"luozeen\", \"xili\", \"夕立\", \"夕莉\", \"罗泽恩\"]", "linked_ids": "[\"CL-101\", \"CL-126\"]"}, {"id": "CL-129", "content": "🔴🔴🔴 罗泽恩冲过火焰时没有被灼烧。 火焰实体对他选择性豁免——允许他通过，但阻止藤堂。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"doctor\", \"fire\", \"flame\", \"kp_scene\", \"luozeen\", \"todo\", \"炎之精\", \"罗泽恩\", \"藤堂咲\"]", "linked_ids": "[\"CL-126\"]"}, {"id": "CL-130", "content": "朗格拍照时活火焰向他扑来——拍摄行为触发了炎之精的攻击反应。朗格掏出撬棍准备战斗。", "source": "KP+朗格RP", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"entity\", \"fire\", \"fire_vampire\", \"flame\", \"lange\", \"朗格\", \"炎之精\"]", "linked_ids": "[\"CL-216\"]"}, {"id": "CL-131", "content": "藤堂敏捷50→95失败——火焰实体主动阻止她通过。与罗泽恩无伤通过形成鲜明对比。", "source": "骰子+KP", "verified": "high", "confidence": "high", "tags": "[\"dice\", \"doctor\", \"fire\", \"flame\", \"luozeen\", \"todo\", \"检定\", \"炎之精\", \"罗泽恩\", \"藤堂咲\", \"骰子\"]", "linked_ids": "[\"CL-129\"]"}, {"id": "CL-132", "content": "🔴 藤堂受伤： 第一轮火焰伤害4点。孤注一掷51/50大失败——伤害取满覆盖为6点。累计6点火焰伤害。", "source": "骰子记录（修正）", "verified": "high", "confidence": "high", "tags": "[\"critical_fail\", \"dice\", \"doctor\", \"fire\", \"flame\", \"fumble\", \"todo\", \"大失败\", \"检定\", \"炎之精\", \"藤堂咲\", \"骰子\"]", "linked_ids": "[\"CL-131\"]"}, {"id": "CL-134", "content": "🔴 第二轮：藤堂再次冲火焰——76/50失败。 火焰伤害+2（累计8点）。", "source": "骰子记录", "verified": "high", "confidence": "high", "tags": "[\"dice\", \"doctor\", \"fire\", \"flame\", \"todo\", \"检定\", \"炎之精\", \"藤堂咲\", \"骰子\"]", "linked_ids": "[\"CL-132\"]"}, {"id": "CL-135", "content": "🔴 朗格穿越火焰取灭火器——64/60失败。 火焰伤害4点。", "source": "骰子记录", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"dice\", \"fire\", \"flame\", \"lange\", \"朗格\", \"检定\", \"炎之精\", \"骰子\"]", "linked_ids": "[\"CL-130\"]"}, {"id": "CL-136", "content": "KP裁定：以伤害为代价允许穿过火焰——\"给伤害让你们过去吧\"。", "source": "KP", "verified": "high", "confidence": "high", "tags": "[\"fire\", \"flame\", \"炎之精\"]", "linked_ids": "[\"CL-134\", \"CL-135\"]"}, {"id": "CL-137", "content": "电梯已无法使用——楼层被火焰封锁。", "source": "KP+朗格RP", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"fire\", \"flame\", \"lange\", \"朗格\", \"炎之精\"]", "linked_ids": "[\"CL-214\"]"}, {"id": "CL-138", "content": "朗格穿过火焰到达消防栓——以灼伤为代价。藤堂穿过火焰到达房间——伤痕累累。", "source": "KP叙述", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"doctor\", \"fire\", \"flame\", \"lange\", \"todo\", \"朗格\", \"炎之精\", \"藤堂咲\"]", "linked_ids": "[\"CL-134\", \"CL-135\"]"}, {"id": "CL-139", "content": "🔴🔴🔴 罗泽恩已在夕立附近——露出邪恶的笑容。 他不是在救她。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"adopted\", \"apprentice\", \"kp_scene\", \"luozeen\", \"xili\", \"夕立\", \"夕莉\", \"罗泽恩\"]", "linked_ids": "[\"CL-129\", \"CL-101\"]"}, {"id": "CL-140", "content": "🔴🔴🔴 罗泽恩（/实体）的遗言： \"时间不对，不对啊。还没有到星辰归位的时候。那个懦夫，居然还留下了一个孩子。既然如此你就逃跑吧，尽力的逃跑吧，永恒的恶意终究会找到你\"", "source": "实体通过罗泽恩发言", "verified": "high", "confidence": "high", "tags": "[\"astronomy\", \"coward\", \"curse\", \"eternal_malice\", \"father\", \"luozeen\", \"ritual_timing\", \"stars_align\", \"yiyan\", \"懦夫\", \"星辰归位\", \"标记\", \"永恒的恶意\", \"罗泽恩\"]", "linked_ids": "[\"CL-068\", \"CL-046\"]"}, {"id": "CL-141", "content": "🔴🔴🔴 罗泽恩化为火人烧尽—— 身上放出火焰，烧干烧尽，只剩下一台相机。活火焰带着相机冲破玻璃跳出窗外。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"camera\", \"fire\", \"flame\", \"kp_scene\", \"luozeen\", \"xiangji\", \"炎之精\", \"相机\", \"罗泽恩\"]", "linked_ids": "[\"CL-214\", \"CL-129\"]"}, {"id": "CL-142", "content": "🔴🔴 相机未被烧毁。 活火焰带走了它——相机是实体在意的物品/锚点/工具。", "source": "KP场景描述", "verified": "high", "confidence": "high", "tags": "[\"KP\", \"camera\", \"fire\", \"flame\", \"kp_scene\", \"xiangji\", \"炎之精\", \"相机\"]", "linked_ids": "[\"CL-092\", \"CL-105\"]"}, {"id": "CL-144", "content": "🔴🔴🔴 \"星辰归位的时候\"——仪式有天文/占星学的时间条件。\"时间不对\"=仪式尚未达到触发点。\"6双眼睛\"+星辰归位=完整的仪式触发条件。", "source": "实体发言", "verified": "high", "confidence": "high", "tags": "[\"astronomy\", \"ritual\", \"ritual_timing\", \"six_eyes\", \"stars_align\", \"victims\", \"yishi\", \"仪式\", \"六双眼睛\", \"星辰归位\"]", "linked_ids": "[\"CL-068\", \"CL-140\"]"}, {"id": "CL-147", "content": "SC——目睹罗泽恩烧尽死亡。藤堂2/65大成功，零SAN损失。（1/1d6）", "source": "KP+骰子", "verified": "high", "confidence": "high", "tags": "[\"SAN\", \"dice\", \"doctor\", \"luozeen\", \"san\", \"sanity\", \"sanity_check\", \"sc\", \"todo\", \"检定\", \"罗泽恩\", \"藤堂咲\", \"骰子\"]", "linked_ids": "[\"CL-141\"]"}, {"id": "CL-148", "content": "🔴 灭火器对炎之精有威胁—— 实体主动攻击持灭火器的朗格。\"看上去灭火器非常具有威胁\"。", "source": "KP叙述", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"entity\", \"fire\", \"fire_vampire\", \"lange\", \"朗格\", \"炎之精\"]", "linked_ids": "[\"CL-133\"]"}, {"id": "CL-149", "content": "🔴🔴 两个炎之精——不是单个实体。 灭火器对其有威胁。", "source": "KP", "verified": "high", "confidence": "high", "tags": "[\"entity\", \"fire\", \"fire_vampire\", \"炎之精\"]", "linked_ids": "[\"CL-214\"]"}, {"id": "CL-150", "content": "朗格灭火器重创炎之精→实体退散。战斗结束。 实体\"像是不存在于世界的某种东西\"——非完全物质化。", "source": "KP", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"entity\", \"fire\", \"fire_vampire\", \"lange\", \"朗格\", \"炎之精\"]", "linked_ids": "[\"CL-149\"]"}, {"id": "CL-151", "content": "🔴 实体退散前的行为特征：以警告/威胁为目的，而非杀死。被灭火器重创后立即撤退——并非不死之身。", "source": "KP叙述", "verified": "high", "confidence": "high", "tags": "[\"general\"]", "linked_ids": "[\"CL-150\"]"}, {"id": "CL-152", "content": "🔴 朗格手机录像——炎之精战斗过程被完整拍摄并发送至群聊。 第二段超自然实体影像证据。", "source": "朗格RP", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"entity\", \"fire\", \"fire_vampire\", \"lange\", \"朗格\", \"炎之精\"]", "linked_ids": "[\"—\"]"}, {"id": "CL-153", "content": "藤堂重伤（累计8点火焰伤），夕立受惊。宾馆现场需善后。", "source": "KP", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"doctor\", \"fire\", \"flame\", \"todo\", \"xili\", \"夕立\", \"夕莉\", \"炎之精\", \"藤堂咲\"]", "linked_ids": "[\"—\"]"}, {"id": "CL-154", "content": "🔴 玛莎识破刘元贞是假道士。 她见过真正的风水大师，知道此事凶险。但选择不告诉赵婉清——可能是保护刘元贞。", "source": "玛莎+KP", "verified": "high", "confidence": "high", "tags": "[\"liu_yuanzhen\", \"martha\", \"taoist\", \"zhao_wangqing\", \"刘元贞\", \"玛莎\", \"赵婉清\"]", "linked_ids": "[\"CL-028\"]"}, {"id": "CL-155", "content": "🔴 真正的风水大师们拒绝来医院——\"他们能预见此事比想象中更凶险。\"", "source": "玛莎", "verified": "high", "confidence": "high", "tags": "[\"martha\", \"玛莎\"]", "linked_ids": "[\"CL-154\"]"}, {"id": "CL-157", "content": "🔴 刘元贞梦境：古帆船上审判。 一个面容阴森的老人被绑在桅杆上，人群宣判他的罪孽。与李锐光梦见的人祭是同一艘船的不同事件。", "source": "刘元贞灵感觉醒（17/45困难成功）", "verified": "high", "confidence": "high", "tags": "[\"ancient_ship\", \"child\", \"dream\", \"human_sacrifice\", \"idea\", \"linggan\", \"liruiguang\", \"liu_yuanzhen\", \"nightmare\", \"ship\", \"taoist\", \"victim\", \"人祭\", \"刘元贞\", \"尸体\", \"帆船\", \"李锐光\", \"梦境\", \"灵感\"]", "linked_ids": "[\"CL-046\", \"CL-040\"]"}, {"id": "CL-158", "content": "🔴🔴 第三个超自然实体——白色浮肿的无头婴儿状生物。 双手长着血盆大口。深夜袭击刘元贞。SC 0/1d3，意志通过。", "source": "KP+刘元贞", "verified": "high", "confidence": "high", "tags": "[\"SAN\", \"baby\", \"beheaded\", \"child\", \"entity\", \"headless\", \"infant\", \"liu_yuanzhen\", \"sanity_check\", \"sc\", \"swollen\", \"taoist\", \"刘元贞\", \"浮肿\"]", "linked_ids": "[\"CL-085\", \"CL-214\"]"}, {"id": "CL-159", "content": "力量对抗：刘元贞60/60成功 vs 实体86/35失败。实体被甩出窗外——融入黑暗无坠落声。与炎之精同理：非完全物质化。", "source": "战斗记录", "verified": "high", "confidence": "high", "tags": "[\"entity\", \"fire\", \"fire_vampire\", \"liu_yuanzhen\", \"taoist\", \"刘元贞\", \"炎之精\"]", "linked_ids": "[\"CL-158\"]"}, {"id": "CL-160", "content": "🔴 梦境→实体入侵的循环确认。 刘元贞入睡做梦→梦中被攻击→惊醒后发现实体物理存在。与李锐光（梦→失明）和夕立（梦→被炎之精袭击）一致的攻击模式。", "source": "KP叙述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"blindness\", \"dream\", \"entity\", \"fire\", \"fire_vampire\", \"liruiguang\", \"liu_yuanzhen\", \"nightmare\", \"shiming\", \"taoist\", \"victim\", \"xili\", \"刘元贞\", \"夕立\", \"夕莉\", \"失明\", \"李锐光\", \"梦\", \"梦境\", \"炎之精\"]", "linked_ids": "[\"CL-030\", \"SL-002\"]"}, {"id": "CL-161", "content": "浮肿婴被甩出窗外后未死——\"直觉告诉你那个玩意没有死去\"。与炎之精同理：可退散但非消灭。", "source": "刘元贞直觉+KP", "verified": "high", "confidence": "high", "tags": "[\"baby\", \"child\", \"entity\", \"fire\", \"fire_vampire\", \"headless\", \"infant\", \"liu_yuanzhen\", \"swollen\", \"swollen_infant\", \"taoist\", \"刘元贞\", \"浮肿\", \"浮肿婴\", \"炎之精\"]", "linked_ids": "[\"CL-159\"]"}, {"id": "CL-166", "content": "实体攻击未留下明显物理伤痕——掐喉后只有\"小小的痕迹\"。超自然伤害不遵循正常创伤模式。", "source": "KP+医生", "verified": "high", "confidence": "high", "tags": "[\"general\"]", "linked_ids": "[\"CL-158\"]"}, {"id": "CL-167", "content": "林芷带警察大队抵达宾馆火场。火灾未扩散——仅藤堂、朗格烧伤。藤堂因烧伤疼痛晕厥。", "source": "KP叙述", "verified": "high", "confidence": "high", "tags": "[\"detective\", \"doctor\", \"lange\", \"todo\", \"朗格\", \"藤堂咲\"]", "linked_ids": "[\"CL-153\"]"}, {"id": "CL-170", "content": "酒店走廊监控拍到炎之精——\"一团诡异的火焰，无法理解的移动，像是有生命一样。\" 清晰证实朗格所言真实。SC 0/1d3。", "source": "林宁调取监控+林芷观看", "verified": "high", "confidence": "high", "tags": "[\"SAN\", \"detective\", \"entity\", \"fire\", \"fire_vampire\", \"flame\", \"lange\", \"sanity_check\", \"sc\", \"朗格\", \"炎之精\"]", "linked_ids": "[\"CL-149\"]"}, {"id": "CL-173", "content": "🔴 夕莉证词——实体遗言完整复述：\"时间不对，星辰归位。那个懦夫，留下了一个孩子。逃跑吧，永恒的恶意会找到你。\" 与朗格群内描述一致。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"astronomy\", \"coward\", \"curse\", \"detective\", \"eternal_malice\", \"father\", \"lange\", \"ritual_timing\", \"stars_align\", \"xili\", \"yiyan\", \"夕立\", \"夕莉\", \"懦夫\", \"星辰归位\", \"朗格\", \"标记\", \"永恒的恶意\"]", "linked_ids": "[\"CL-140\"]"}, {"id": "CL-174", "content": "夕莉描述实体声音：\"像是和我差不多大的年纪，又非常老练\"——少年外壳下的古老意识。在遗言前还念了一段她听不清的\"咒语\"。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"xili\", \"夕立\", \"夕莉\"]", "linked_ids": "[\"CL-139\"]"}, {"id": "CL-175", "content": "夕莉确认梦中也有熟悉感——与李锐光、刘元贞一致的\"梦→实体入侵\"模式。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"liruiguang\", \"liu_yuanzhen\", \"taoist\", \"victim\", \"xili\", \"刘元贞\", \"夕立\", \"夕莉\", \"李锐光\"]", "linked_ids": "[\"CL-160\"]"}, {"id": "CL-176", "content": "🔴 夕莉梦境——她是学徒，在古帆船上。 一个老师教她天文/药配/解剖。\"老师说我有天赋。\"但老师在\"做可怕、错误的事\"。梦越来越真实。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"ancient_ship\", \"apprentice\", \"dream\", \"nightmare\", \"ship\", \"xili\", \"夕立\", \"夕莉\", \"帆船\", \"梦境\"]", "linked_ids": "[\"CL-157\", \"CL-046\"]"}, {"id": "CL-177", "content": "🔴🔴 船上人员——夕莉回忆： 船长、大副、老师、船工、瞭望手、教授（和船长与老师都很熟悉的教授）。共七人含学徒。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"xili\", \"夕立\", \"夕莉\"]", "linked_ids": "[\"CL-176\"]"}, {"id": "CL-180", "content": "🔴🔴 夕莉：船长和教授寻找宝藏——\"只需要按照献祭动作，就能获得神赐予的宝藏。教授说过，那是一个亲近人类的神明，只要仪式是正确的。\" 教授是仪式推动者。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"ritual\", \"sacrifice\", \"xili\", \"yishi\", \"仪式\", \"夕立\", \"夕莉\", \"献祭\"]", "linked_ids": "[\"CL-177\"]"}, {"id": "CL-182", "content": "🔴🔴 船上两派—— 教授：\"献祭给亲近人类的神明换宝藏\"。老师（船医/学者）：\"世界是一道帷幕，一道墙隔开人类与真正世界。\" 要信仰\"真正有价值的神明\"。与李锐光催眠中\"墙后面的主人\"直接关联。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"cuimian\", \"hypnosis\", \"liruiguang\", \"sacrifice\", \"victim\", \"xili\", \"催眠\", \"夕立\", \"夕莉\", \"李锐光\", \"献祭\"]", "linked_ids": "[\"CL-068\", \"CL-180\"]"}, {"id": "CL-183", "content": "🔴 老师=船上的医生+学者。 教授=华莱士的前世对应角色。老师推动\"墙\"的信仰。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"mithras\", \"professor\", \"wallace\", \"xili\", \"华莱士\", \"夕立\", \"夕莉\"]", "linked_ids": "[\"CL-176\", \"CL-182\"]"}, {"id": "CL-184", "content": "🔴🔴🔴 老师的名字——钱德睿。 夕莉在回忆中艰难说出。疑似与李锐光催眠中\"亵渎的、无法发出声音的名字\"（CL-075）为同一人。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"blasphemy\", \"cuimian\", \"hypnosis\", \"liruiguang\", \"name\", \"qian_derui\", \"teacher\", \"victim\", \"xili\", \"亵渎\", \"催眠\", \"夕立\", \"夕莉\", \"李锐光\", \"钱德睿\"]", "linked_ids": "[\"CL-075\"]"}, {"id": "CL-185", "content": "🔴 夕莉前世名字：觋夕香里。 日本人，父亲带来香港后被弃于烟花柳巷。老师钱德睿\"捡到了她\"。觋（xí）=通灵者/男巫——名字自带灵媒意味。", "source": "夕莉口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"blasphemy\", \"past_life\", \"qian_derui\", \"teacher\", \"xili\", \"xixiangli\", \"夕立\", \"夕莉\", \"觋夕香里\", \"钱德睿\"]", "linked_ids": "[\"CL-184\"]"}, {"id": "CL-186", "content": "🔴🔴 医院警报——李锐光病房出事。 林芷+朗格飞奔上楼。刘元贞描述：浮肿婴+梦境审判场景。", "source": "KP", "verified": "high", "confidence": "high", "tags": "[\"baby\", \"child\", \"detective\", \"dream\", \"entity\", \"headless\", \"infant\", \"lange\", \"liruiguang\", \"liu_yuanzhen\", \"nightmare\", \"swollen\", \"swollen_infant\", \"taoist\", \"victim\", \"刘元贞\", \"朗格\", \"李锐光\", \"梦境\", \"浮肿\", \"浮肿婴\"]", "linked_ids": "[\"—\"]"}, {"id": "CL-187", "content": "🔴 刘元贞当面证实：浮肿婴=每晚折磨李锐光的实体。 \"就是ta让李公子每夜精神折磨。\" 结合李锐光说浮肿婴每晚掐喉——每晚一次的攻击与噩梦频率一致。", "source": "刘元贞口述", "verified": "high", "confidence": "high", "tags": "[\"baby\", \"child\", \"dream\", \"entity\", \"headless\", \"infant\", \"liruiguang\", \"liu_yuanzhen\", \"nightmare\", \"swollen\", \"swollen_infant\", \"taoist\", \"victim\", \"刘元贞\", \"噩梦\", \"李锐光\", \"浮肿\", \"浮肿婴\"]", "linked_ids": "[\"CL-158\"]"}, {"id": "CL-188", "content": "🔴 刘元贞梦境补充： 古帆船上老头被绑+隔壁有人在审判。与夕莉和李锐光的梦境一致——三人三梦，同一艘船。", "source": "刘元贞口述", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"ancient_ship\", \"apprentice\", \"dream\", \"liruiguang\", \"liu_yuanzhen\", \"nightmare\", \"ship\", \"taoist\", \"victim\", \"xili\", \"刘元贞\", \"夕立\", \"夕莉\", \"帆船\", \"李锐光\", \"梦境\"]", "linked_ids": "[\"CL-157\", \"CL-177\"]"}, {"id": "CL-189", "content": "医院监控——浮肿婴未被拍到（超自然实体对监控不可见）。但罗泽恩多次出现在监控中，一直在医院附近徘徊——相机实体在监视失明者。", "source": "监控调取", "verified": "high", "confidence": "high", "tags": "[\"baby\", \"blindness\", \"camera\", \"child\", \"entity\", \"headless\", \"infant\", \"luozeen\", \"shiming\", \"swollen\", \"swollen_infant\", \"xiangji\", \"失明\", \"浮肿\", \"浮肿婴\", \"相机\", \"罗泽恩\"]", "linked_ids": "[\"CL-158\", \"CL-081\"]"}, {"id": "CL-191", "content": "🔴 普通监控无法拍到超自然实体。 浮肿婴未被医院监控拍到。炎之精在酒店走廊可见但AI判为合成。只有老式相机能清晰记录实体影像。", "source": "监控+刘元贞+朗格", "verified": "high", "confidence": "high", "tags": "[\"baby\", \"camera\", \"child\", \"detective\", \"entity\", \"fire\", \"fire_vampire\", \"headless\", \"infant\", \"lange\", \"liu_yuanzhen\", \"swollen\", \"swollen_infant\", \"taoist\", \"xiangji\", \"刘元贞\", \"朗格\", \"浮肿\", \"浮肿婴\", \"炎之精\", \"相机\"]", "linked_ids": "[\"CL-189\", \"CL-082\"]"}, {"id": "CL-192", "content": "相机未在火灾现场被发现——无残骸、无塑料燃烧气味。与朗格所述\"人型灰烬+相机消失\"一致。相机自行离开了火场。", "source": "林芷+朗格对案+调查报告", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"detective\", \"lange\", \"xiangji\", \"朗格\", \"相机\"]", "linked_ids": "[\"CL-141\", \"CL-142\"]"}, {"id": "CL-193", "content": "林芷向朗格出示相机反抗录像。\"相机是活的\"——朗格确认。", "source": "林芷+朗格RP", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"detective\", \"lange\", \"xiangji\", \"朗格\", \"相机\"]", "linked_ids": "[\"CL-105\"]"}, {"id": "CL-194", "content": "🔴🔴🔴 三人困难灵感逐帧慢放成功——相机隐藏照片曝光。 发现：(1) 一个肥胖臃肿的浮尸般女人，她拍了几张自拍（实体在自我记录）；(2) 三个地点：金柏村老楼、私人别墅、翰光疗养院（罗泽恩母亲所在地）。", "source": "逐帧慢放+困难灵感", "verified": "high", "confidence": "high", "tags": "[\"ancestral\", \"camera\", \"hanguang\", \"idea\", \"jinbai\", \"linggan\", \"luozeen\", \"sanatorium\", \"villa\", \"village\", \"xiangji\", \"别墅\", \"李翰光\", \"灵感\", \"相机\", \"罗泽恩\", \"翰光疗养院\", \"金柏村\"]", "linked_ids": "[\"CL-105\", \"CL-194\"]"}, {"id": "CL-198", "content": "🔴 三人已知共同线索集已对齐： 罗泽恩/相机/三个实体/夕莉前世/钱德睿/\"6双眼睛\"+\"星辰归位\"——已同步至刘元贞。但仪式的具体运作机制仍不清楚。", "source": "朗格极难话术14/80", "verified": "high", "confidence": "high", "tags": "[\"adopted\", \"apprentice\", \"astronomy\", \"blasphemy\", \"camera\", \"detective\", \"lange\", \"liu_yuanzhen\", \"luozeen\", \"persuade\", \"persuasion\", \"qian_derui\", \"ritual\", \"ritual_timing\", \"six_eyes\", \"stars_align\", \"taoist\", \"teacher\", \"victims\", \"xiangji\", \"xili\", \"yishi\", \"仪式\", \"六双眼睛\", \"刘元贞\", \"夕立\", \"夕莉\", \"星辰归位\", \"朗格\", \"相机\", \"罗泽恩\", \"话术\", \"钱德睿\"]", "linked_ids": "[\"CL-141\"]"}, {"id": "CL-200", "content": "🔴🔴 仪式全貌： 群星归位→献6双目睹神迹的眼睛泡蜡油→子嗣与盟友协助主持人→切左手封印于魂器(不死身)→献仇人眼→召■■■■■。", "source": "玛莎→《启示录》残卷", "verified": "high", "confidence": "high", "tags": "[\"immortality\", \"manuscript\", \"martha\", \"phylactery\", \"revelation\", \"ritual\", \"wax\", \"yishi\", \"仪式\", \"启示录\", \"残卷\", \"玛莎\", \"蜡油\", \"魂器\"]", "linked_ids": "[\"CL-068\", \"CL-101\", \"CL-102\"]"}, {"id": "CL-201", "content": "🔴🔴 不死之身的秘密： 一个魂器（封印左手）+ 一只受神明祝福的手。不同时摧毁两者即无法杀死仪式主持者。", "source": "《启示录》残卷", "verified": "high", "confidence": "high", "tags": "[\"immortality\", \"manuscript\", \"phylactery\", \"revelation\", \"ritual\", \"yishi\", \"仪式\", \"启示录\", \"残卷\", \"魂器\"]", "linked_ids": "[\"CL-200\"]"}, {"id": "CL-204", "content": "🔴 玛莎确认相机=同一台，少年=同一人。 华莱士教授是知情人但拒绝深入。", "source": "玛莎", "verified": "high", "confidence": "high", "tags": "[\"camera\", \"martha\", \"mithras\", \"professor\", \"wallace\", \"xiangji\", \"华莱士\", \"玛莎\", \"相机\"]", "linked_ids": "[\"CL-006\"]"}, {"id": "CL-205", "content": "🔴 李家祭祀习俗： 出航前做饭抛肉入海祈福。祖上曾有\"昧良心的家伙\"用小孩代替牲口→出海凶险→从此严守章程。", "source": "赵夫人(漏嘴)", "verified": "high", "confidence": "high", "tags": "[\"child\", \"sacrifice\", \"小孩\"]", "linked_ids": "[\"CL-200\"]"}, {"id": "CL-206", "content": "🔴 李家捐老书旧物给市图书馆。 管家赵夫人说李父很忌讳，从不提\"那个家伙\"。图书馆是史料突破口。", "source": "赵夫人", "verified": "high", "confidence": "high", "tags": "[\"library\", \"图书馆\"]", "linked_ids": "[\"CL-205\"]"}, {"id": "CL-207", "content": "🔴🔴🔴 罗泽恩之父死亡真相： 李家祖宅翻新工程（设计=陈省）→施工期总死人（工程队+村民）→姓罗的包工头死状极惨→配偶疯了→留下孤苦孩子=罗泽恩。之后李老爷辞退陈省，封禁祖宅话题。", "source": "赵夫人漏嘴→朗格录音", "verified": "high", "confidence": "high", "tags": "[\"ancestral_house\", \"chen_sheng\", \"detective\", \"engineer\", \"lange\", \"luozeen\", \"underground\", \"朗格\", \"祖宅\", \"罗泽恩\", \"陈省\"]", "linked_ids": "[\"CL-200\", \"CL-204\"]"}, {"id": "CL-210", "content": "🔴 唐蓉蓉信息： 年轻的金融经理，老公很恩爱，老公送花发美食照片。不在医院，在家休养。和陈省不是同一阶层。", "source": "赵夫人", "verified": "high", "confidence": "high", "tags": "[\"chen_sheng\", \"engineer\", \"manager\", \"tang_rongrong\", \"唐蓉蓉\", \"陈省\"]", "linked_ids": "[\"—\"]"}, {"id": "CL-211", "content": "🔴 陈省——曾被李家辞退的工程师。 赵夫人说他总是要李氏集团的钱。工程设计图失误→出大事故→被老爷辞退→瞎了叫\"报应\"。但另一个视角： 他是祖宅翻新的工程师，亲身见过那地方死过人。", "source": "赵夫人", "verified": "high", "confidence": "high", "tags": "[\"ancestral_house\", \"chen_sheng\", \"engineer\", \"underground\", \"祖宅\", \"陈省\"]", "linked_ids": "[\"CL-207\"]"}, {"id": "CL-212", "content": "🔴 林芷噩梦： 溺水感、无数白色手掌、手掌中心裂开利齿般的大嘴，如同通往无尽幽森的黑暗通道。SC 0/1（成功通过）。", "source": "林芷梦境", "verified": "medium", "confidence": "medium", "tags": "[\"dream\", \"drowning\", \"hands\", \"mouth\", \"darkness\", \"林芷\"]", "linked_ids": "[\"—\"]"}, {"id": "CL-214", "content": "🔴 陈省欠高利贷： 黑衣人自称金融公司融资经理，实为黑道追债。陈省已走投无路——给出情报的动机很强，但也可能已被债主/对手控制。", "source": "林芷+朗格侦查", "verified": "high", "confidence": "high", "tags": "[\"陈省\", \"loan_shark\", \"debt\", \"financial\"]", "linked_ids": "[\"NPC-016\", \"CL-213\"]"}, {"id": "CL-215", "content": "🔴🔴 翰光疗养院——陈省被转移目标地： 黑衣人展示合同——翰光疗养院支付了陈省全部债务（女学/房贷/车贷），签约为'新型药品测试人员'，今天出院即转院至翰光。注意： 罗泽恩之母也在翰光（CL-125），相机曾拍到翰光疗养院照片（CL-194）——此地绝非普通疗养院。", "source": "林芷审查合同", "verified": "high", "confidence": "high", "tags": "[\"翰光疗养院\", \"陈省\", \"drug_trial\", \"罗泽恩\", \"camera\"]", "linked_ids": "[\"CL-125\", \"CL-194\", \"CL-209\", \"NPC-016\"]"}, {"id": "CL-216", "content": "🔴🔴 金柏村挖出蜡油骨桶： 陈省透露——翻修李家祖宅/祠堂时挖出木桶，内装蜡油浸泡的骨头烂肉（大多是动物骨）。施工队持续噩梦、生病、死人。李家未报警，清理后就地掩埋。蜡油手法与仪式描述（眼睛泡蜡油）高度吻合。", "source": "陈省口述", "verified": "high", "confidence": "high", "tags": "[\"金柏村\", \"barrel\", \"wax\", \"bones\", \"ritual\", \"祖宅\", \"construction\"]", "linked_ids": "[\"CL-207\", \"CL-200\", \"CL-125\", \"CL-068\"]"}, {"id": "CL-217", "content": "🔴🔴🔴 李家祖宅地下暗道/空间： 陈省透露——祖宅翻修的核心是扩建地下，祖宅地下本就留有巨大空间/暗道，通往不明地点。", "source": "陈省口述", "verified": "high", "confidence": "high", "tags": "[\"祖宅\", \"underground\", \"tunnel\", \"暗道\", \"空间\"]", "linked_ids": "[\"CL-207\", \"CL-216\"]"}, {"id": "CL-218", "content": "🔴🔴🔴 无头小孩尸体——人祭确认： 施工挖出的骨桶中，陈省确认有一部分是无头的小孩尸体。与此前赵夫人'有人用小孩代替牲口'吻合——浮肿婴/生祭的实体证据。", "source": "陈省口述", "verified": "high", "confidence": "high", "tags": "[\"child_sacrifice\", \"headless\", \"human_remains\", \"浮肿婴\", \"ritual\"]", "linked_ids": "[\"CL-205\", \"CL-216\", \"CL-207\"]"}, {"id": "CL-219", "content": "img:amulet-seal.webp 🔴🔴🔴 陈省的工匠梦境+旧印护身符： 失明后也做船上噩梦——梦中自己是造船工匠，能听到海里不详的声音。后在祖宅地下找到一枚石印章（旧印），由神父确认后随身携带，自此噩梦停止。", "source": "陈省口述+实物", "verified": "high", "confidence": "high", "tags": "[\"dream\", \"ship\", \"shipwright\", \"old_one\", \"seal\", \"护身符\", \"旧印\"]", "linked_ids": "[\"CL-068\", \"CL-212\", \"CL-046\"]"}, {"id": "CL-220", "content": "🔴🔴 梦中神父=华莱士教授： 陈省确认——船上梦境中的'神父'名叫华莱士，教导工匠如何远离疯狂。这条梦中记忆指引他在工地发现了旧印。华莱士不只是现实中的密大教授——他也是梦境世界中的角色。", "source": "陈省口述", "verified": "high", "confidence": "high", "tags": "[\"华莱士\", \"priest\", \"dream\", \"ship\", \"old_one\", \"教授\"]", "linked_ids": "[\"CL-219\", \"CL-062\", \"CL-038\"]"}, {"id": "CL-222", "content": "🔴🔴🔴 翰光疗养院 = 李翰光（李老爷）私有： 高建国亲口证实——翰光疗养院由李家老爷李翰光私下建立，绝非普通医疗机构。此院正在系统性收集/控制与李家事件相关的人员。", "source": "高建国口述", "verified": "high", "confidence": "high", "tags": "[\"翰光疗养院\", \"李翰光\", \"李家\", \"李老爷\"]", "linked_ids": "[\"CL-215\", \"CL-062\", \"CL-125\"]"}, {"id": "CL-223", "content": "🔴🔴🔴 唐蓉蓉——仪式失败品： 已化为巨大肉瘤/肉块，身体溶解，只剩头颅在笑。'看到美丽景色'——仪式转化失败。眼睛脱落，脑袋彻底溶解。高建国也被转化/操控，皮肤惨白浮肿。", "source": "林芷+朗格目击", "verified": "high", "confidence": "high", "tags": "[\"唐蓉蓉\", \"ritual_failure\", \"flesh_mass\", \"肉瘤\", \"溶解\"]", "linked_ids": "[\"CL-221\", \"CL-222\"]"}, {"id": "CL-224", "content": "🔴🔴🔴 目睹■■■■■化身（失败品）： 肉瘤延伸出多个肢体，肢端长满七鳃鳗般的利齿大嘴。SC 1d6/1d20。此形态与林芷噩梦中的白色手掌/利齿大嘴高度吻合（CL-212）。", "source": "林芷+朗格目击", "verified": "high", "confidence": "high", "tags": "[\"avatar\", \"failed\", \"flesh_monster\", \"lamprey_mouth\", \"化身\", \"失败品\"]", "linked_ids": "[\"CL-223\", \"CL-212\", \"CL-085\"]"}, {"id": "CL-225", "content": "🔴🔴🔴 华莱士教授现身救援： 在朗格濒死时刻，华莱士·阿普顿爵士赶到，以光芒驱散瓦解中的仪式失败品。英伦学者背影——正式与调查员会面。", "source": "KP场景", "verified": "high", "confidence": "high", "tags": "[\"华莱士\", \"rescue\", \"教授\", \"save\", \"爵士\"]", "linked_ids": "[\"CL-220\", \"CL-062\"]"}, {"id": "CL-226", "content": "🔴🔴 华莱士确认钱德睿计划近完成： 华莱士亲口对朗格说\"钱德睿的计划已经几乎完成了。我还是来迟了一步。\"——钱德睿=仪式幕后策划者，仪式已近尾声，时间窗口正在关闭。", "source": "华莱士口述", "verified": "high", "confidence": "high", "tags": "[\"华莱士\", \"钱德睿\", \"plan\", \"ritual_endgame\", \"仪式\"]", "linked_ids": "[\"CL-225\", \"CL-184\", \"CL-075\"]"}, {"id": "CL-227", "content": "华莱士拒绝单独行动——坚持等警察到场再详谈。暗示后续情报需林芷在场（警察身份+程序合法性）。", "source": "华莱士行为", "verified": "high", "confidence": "high", "tags": "[\"华莱士\", \"police\", \"林芷\", \"等待\"]", "linked_ids": "[\"CL-226\"]"}, {"id": "CL-228", "content": "重案专家组获批成立： 林芷调兵申请获批，警方正式以邪教预谋杀人祭祀案件立案。重案组介入调查。", "source": "KP场景", "verified": "high", "confidence": "high", "tags": "[\"police\", \"重案组\", \"investigation\", \"警方\"]", "linked_ids": "[\"CL-225\"]"}, {"id": "CL-229", "content": "藤堂咲苏醒： 此前因炎之精火焰重伤（HP-8），经两次手术后从晕厥中恢复意识。\"6双眼睛\"的唯一全程知情者。", "source": "KP场景", "verified": "high", "confidence": "high", "tags": "[\"藤堂\", \"觉醒\", \"wake_up\", \"surgery\", \"6眼睛\"]", "linked_ids": "[\"CL-068\", \"CL-123\"]"}, {"id": "CL-230", "content": "🔴🔴🔴 **仪式时间=明天晚上**：华莱士确认——仪式将在明天（07-24）晚上举行。时间窗口不足30小时。位置他\"有猜测但不确认\"。", "source": "华莱士", "verified": "high", "confidence": "high", "tags": "[\"仪式\", \"timing\", \"明天\", \"tonight\", \"time_crunch\", \"时间\"]", "linked_ids": "[\"CL-226\", \"CL-078\"]"}, {"id": "CL-231", "content": "🔴🔴 钱德睿身份：香港风水先生。华莱士祖辈的传教士旧识——曾评价他\"对神秘学了解非常深邃\"。但最终走上不归路。", "source": "华莱士", "verified": "high", "confidence": "high", "tags": "[\"钱德睿\", \"香港\", \"fengshui\", \"风水先生\", \"传教士\", \"mystic\"]", "linked_ids": "[\"CL-226\", \"CL-075\"]"}, {"id": "CL-232", "content": "🔴🔴 钱德睿为李家先祖勘探\"通往黄金国度的道路\"：通过他的祭祀仪式，为李家开辟一条通往\"黄金国度\"的航路。这些仪式全部指向一个神明的启示——即《启示录》这本书。", "source": "华莱士", "verified": "high", "confidence": "high", "tags": "[\"钱德睿\", \"李家\", \"黄金国度\", \"golden_land\", \"启示录\", \"ritual\", \"祭祀\"]", "linked_ids": "[\"CL-231\", \"CL-200\"]"}, {"id": "CL-233", "content": "🔴🔴🔴 **魂器真相——钱德睿的左手=魂器本身**：华莱士确认——钱德睿不死的秘密在于提前砍下自己的左手藏匿。左手不是封印在容器里，**左手本身就是魂器**。", "source": "华莱士", "verified": "high", "confidence": "high", "tags": "[\"魂器\", \"左手\", \"钱德睿\", \"immortality\", \"不死\"]", "linked_ids": "[\"CL-231\", \"CL-226\", \"CL-200\"]"}, {"id": "CL-234", "content": "🔴🔴🔴 **钱德睿肉身已灭**：华莱士先祖发现钱德睿祭祀人类的恶行后，将他烧成灰烬并埋葬在盐巴之中。但抓住他时，**左手已经被他自己砍下藏了起来**。", "source": "华莱士", "verified": "high", "confidence": "high", "tags": "[\"钱德睿\", \"burnt\", \"exorcism\", \"华莱士家族\", \"焚灭\", \"盐\"]", "linked_ids": "[\"CL-233\", \"CL-200\"]"}, {"id": "CL-239", "content": "🔴🔴 **魂器摧毁法——圣经+盐**：华莱士有先祖记载的仪式方法，能彻底消灭钱德睿的左手魂器。需要找到左手，圣经+盐即可执行。", "source": "华莱士", "verified": "high", "confidence": "high", "tags": "[\"魂器\", \"destroy\", \"左臂\", \"bible\", \"salt\", \"圣经\", \"盐\"]", "linked_ids": "[\"CL-233\", \"CL-237\"]"}, {"id": "CL-241", "content": "🔴🔴🔴 **钱家老宅位置确认**：夕莉+华莱士共同还原出钱德睿老宅所在。即魂器（左手）真正藏匿地。", "source": "全员确认", "verified": "high", "confidence": "high", "tags": "[\"钱家老宅\", \"位置\", \"坐标\", \"定位\", \"突袭\"]", "linked_ids": "[\"CL-237\", \"CL-240\"]"}, {"id": "CL-242", "content": "🔴🔴 **李家祖宅=钱德睿设置的诱饵/陷阱**：并非魂器所在。钱德睿故意制造李家祖宅可疑的假象以误导追踪者。", "source": "KP明示", "verified": "high", "confidence": "high", "tags": "[\"李家祖宅\", \"诱饵\", \"trap\", \"陷阱\"]", "linked_ids": "[\"CL-237\", \"CL-207\"]"}, {"id": "CL-243", "content": "🔴🔴🔴 **仪式已实质上失败**：钱德睿已无法凑齐6双眼睛（唐蓉蓉化、西门未捕、李锐光在保护下）。他选择放弃仪式、准备撤离逃亡，寻找东山再起时机。华莱士确认——任务目标转为阻止灵魂逃亡而非阻止仪式。", "source": "华莱士分析", "verified": "high", "confidence": "high", "tags": "[\"仪式失败\", \"retreat\", \"逃亡\", \"钱德睿\"]", "linked_ids": "[\"CL-230\", \"CL-226\", \"CL-223\"]"}, {"id": "CL-244", "content": "🔴🔴🔴 **翰光疗养院=钱德睿老巢**：夕莉+华莱士定位的钱家老宅即翰光疗养院所在。翰光不仅是李翰光的产业——它建立在钱德睿的旧宅原址上。陈省被转院至此、罗泽恩母亲在此——全是被收网的钱德睿目标。", "source": "推理确认", "verified": "high", "confidence": "high", "tags": "[\"翰光疗养院\", \"钱家老宅\", \"老巢\", \"raid\"]", "linked_ids": "[\"CL-241\", \"CL-222\", \"CL-237\"]"}, {"id": "CL-246", "content": "🔴 翰光疗养院地下通道入口：林芷嗅觉敏锐发现房间内有通往地下的秘密通道（侦查极难成功 D100=4/80）。", "source": "林芷侦查", "verified": "high", "confidence": "high", "tags": "[\"翰光\", \"地下通道\", \"secret_entrance\", \"林芷\"]", "linked_ids": "[\"CL-244\"]"}, {"id": "CL-247", "content": "🔴 院长及医护人员=浮肿尸婴伪装：打开地下通道瞬间，院长与医护爆裂转化为浮肿尸婴（与唐蓉蓉别墅高建国同类）。此疗养院全部工作人员已被替换/渗透。", "source": "KP场景", "verified": "high", "confidence": "high", "tags": "[\"尸婴\", \"staff\", \"disguise\", \"转化\", \"疗养院\"]", "linked_ids": "[\"CL-246\", \"CL-244\"]"}, {"id": "CL-248", "content": "🔴🔴🔴 **魂器左手确认位置**：洞穴中央肉制塑像之上。钱德睿的左手即在此。林芷已布阵准备夺取。", "source": "全员目击", "verified": "high", "confidence": "high", "tags": "[\"魂器\", \"左手\", \"洞穴\", \"塑像\"]", "linked_ids": "[\"CL-233\", \"CL-241\"]"}, {"id": "CL-249", "content": "🔴🔴 钱德睿请神失败： 试图低语'伊戈罗■■'完成召唤——但因仪式残缺（缺3双眼睛），精神无法满足神明需求。巨大肉块未完全成型。", "source": "KP场景", "verified": "high", "confidence": "high", "tags": "[\"钱德睿\", \"请神失败\", \"incomplete\", \"ritual\"]", "linked_ids": "[\"CL-243\", \"CL-244\"]"}], "npcs": [{"id": "NPC-002", "name": "李锐光", "role": "李氏集团独子，密斯卡托尼克大学民俗学一年级（导师华莱士）", "stance": "第5个失明者（三天前，海滨大道35号）", "faction": "李氏家族", "key_facts": "[\"精神崩溃; 梦境始于密大（约一个月前），华莱士让其回国; 百年古帆船+蜡封入桶献祭; 梦中船上有\\\"家族勋章\\\"; 阅读航海/志怪/历史/政府档案——系统性研究; 失明后瞳孔光反射全阴性，热感保留\"]", "relationships": "[\"NPC-008（父亲）; NPC-004（玛莎，女友同学）; NPC-007（刘元贞，驱魔）; CL-068（6双眼睛）; CL-075（亵渎之名）\"]"}, {"id": "NPC-003", "name": "赵婉清", "role": "李锐光母亲，李氏集团女主人", "stance": "委托人→🔴 已关闭刑侦/医学通道，全面倒向超自然", "faction": "李氏家族", "key_facts": "[\"全天陪护; 初信医学后转向超自然; 驱逐藤堂/朗格/林芷; 信任刘元贞; 对祖先历史不知情\"]", "relationships": "[\"NPC-002（儿子）; NPC-008（丈夫）; NPC-007（刘元贞，信任）\"]"}, {"id": "NPC-004", "name": "玛莎（Martha）", "role": "密大民
